#Keeps the current wallpaper, with a softly dimmed, frosted-glass treatment.


general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    path = 
    blur_passes = 2
    blur_size = 8
    noise = 0.0100
    contrast = 0.9500
    brightness = 0.6500
    vibrancy = 0.1200
    vibrancy_darkness = 0.0500
}

# The large, high-contrast clock is the visual anchor of the macOS lock screen.
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %B %-d')"
    color = rgba(255, 255, 255, 0.92)
    font_size = 24
    font_family = Noto Sans
    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(255, 255, 255)
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.15
    font_size = 96
    font_family = Noto Sans
    position = 0, 265
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi $USER :)
    color = rgba(255, 255, 255, 0.96)
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.40)
    font_size = 22
    font_family = Noto Sans
    position = 0, -355
    halign = center
    valign = center
}

# A rounded, translucent password field echoes the macOS sign-in control.
input-field {
    monitor =
    size = 290, 54
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.42)
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgb(255, 255, 255)
    check_color = rgba(255, 255, 255, 0.72)
    fail_color = rgba(255, 99, 99, 0.90)
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL</i>
    rounding = -1
    position = 0, -410  # -205
    halign = center
    valign = center
}
